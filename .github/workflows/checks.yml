name: Notebook and pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test environment
        run: |
          python -m pip install 'numpy>=1.24,<2' 'nbformat>=5.10,<6'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate notebook
        run: python scripts/check_notebook.py
      - name: Check synthetic pipeline
        run: python -m unittest discover -s tests -v
